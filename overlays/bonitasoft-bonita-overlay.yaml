# --- deployment model: the servers[] block needs explaining, not replacing ---
- target: $.servers
  update:
    x-apievangelist-deployment-model: >-
      Bonita is self-hosted software. The declared server
      http://localhost:8080/bonita is the vendor's own labelled sample for a local
      development instance and is CORRECT as published — there is no
      vendor-operated production host to substitute. Real bases: Bonita Cloud
      production https://{customer-name}.bonitacloud.com/bonita, Bonita Cloud
      non-production https://{customer-name}-integration.bonitacloud.com/bonita,
      on-premises {scheme}://{host}:{port}/bonita. Documented at
      https://documentation.ofelia.com/cloud/latest/manage/url-customization.
    x-apievangelist-do-not-repair: >-
      Do NOT rewrite this servers[] block to a concrete host. A localhost server
      here is a true statement about a self-hosted product, not a placeholder
      defect.

