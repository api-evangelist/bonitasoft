- target: $.components.securitySchemes
  update:
    x-apievangelist-model: >-
      Session + CSRF, not API keys or OAuth. bonita_auth is the JSESSIONID cookie
      from POST /loginservice; bonita_token is the X-Bonita-API-Token CSRF header
      required on POST/PUT/DELETE and read from the cookie of the most recent
      successful login; bearer_auth applies only when an Enterprise runtime is
      configured for OIDC SSO.
    x-apievangelist-authorization-model: >-
      Profile/permission based, NOT OAuth scopes. Endpoints map to permissions and
      permissions to profiles (User, Administrator, Super Administrator), with
      static and dynamic authorization checks enabled by default. This is why no
      OAuthScopes artifact exists for this provider.
    x-apievangelist-docs: https://documentation.ofelia.com/bonita/latest/identity/rest-api-authorization

