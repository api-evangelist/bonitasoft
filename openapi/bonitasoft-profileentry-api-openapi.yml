openapi: 3.2.0
info:
  license:
    name: GPL-v2.0
    url: http://www.gnu.org/licenses/gpl-2.0.txt
  version: 1.0.9
  title: Bonita Profile Entry API
  description: 'Download OpenAPI specification

    Download Postman collection


    The REST API lets you access the data with HTTP requests; it is useful when implementing rich web forms / pages for a good user experience.'
  x-logo:
    url: images/ofelia-logo.svg
    backgroundColor: '#19465f'
    altText: Bonita API
    href: /
servers:
- url: http://localhost:8080/bonita
  description: Sample url for a local development server.
security:
- bonita_auth: []
  bonita_token: []
- bearer_auth: []
tags:
- name: ProfileEntry
  x-displayName: ProfileEntry
  description: ProfileEntry
paths:
  /API/portal/profileEntry:
    get:
      tags:
      - ProfileEntry
      summary: Finds ProfileEntries
      deprecated: true
      description: 'Finds ProfileEntries with pagination params and filters


        - can search on `name`

        - can filter on `page`,`name` and `parent_id`


        Warning: Since Bonita 7.13, ProfileEntry is deprecated'
      operationId: searchProfileEntries
      parameters:
      - $ref: '#/components/parameters/pageIndex'
      - $ref: '#/components/parameters/pageCount'
      - $ref: '#/components/parameters/pageFilter'
      - $ref: '#/components/parameters/pageSearch'
      responses:
        '200':
          description: 'Success '
          headers:
            Content-Range:
              schema:
                type: integer
                format: int64
              description: The total number of matching items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProfileEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        5XX:
          $ref: '#/components/responses/ServerError'
    post:
      tags:
      - ProfileEntry
      summary: Create the ProfileEntry
      deprecated: true
      description: 'Create the ProfileEntry

        Warning: Since Bonita 7.13, ProfileEntry is deprecated'
      operationId: createProfileEntry
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileEntryCreateRequest'
        description: Partial ProfileEntry description
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileEntry'
          description: 'Success '
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        5XX:
          $ref: '#/components/responses/ServerError'
      x-codegen-request-body-name: body
  /API/portal/profileEntry/{id}:
    get:
      tags:
      - ProfileEntry
      summary: Finds the ProfileEntry by ID
      deprecated: true
      description: 'Returns the single ProfileEntry for the given ID

        Warning: Since Bonita 7.13, ProfileEntry is deprecated'
      operationId: getProfileEntryById
      parameters:
      - description: ID of the ProfileEntry to return
        in: path
        name: id
        required: true
        schema:
          type: string
          maxLength: 250
          pattern: ^[A-Za-z0-9\_\-\.]{0,250}$
      responses:
        '200':
          description: 'Success '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        5XX:
          $ref: '#/components/responses/ServerError'
    put:
      tags:
      - ProfileEntry
      summary: Update the ProfileEntry by ID
      deprecated: true
      description: 'Update the ProfileEntry for the given ID

        Warning: Since Bonita 7.13, ProfileEntry is deprecated'
      operationId: updateProfileEntryById
      parameters:
      - description: ID of the ProfileEntry to return
        in: path
        name: id
        required: true
        schema:
          type: string
          maxLength: 250
          pattern: ^[A-Za-z0-9\_\-\.]{0,250}$
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileEntryUpdateRequest'
        description: Partial ProfileEntry description
        required: true
      responses:
        '200':
          $ref: '#/components/responses/OK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        5XX:
          $ref: '#/components/responses/ServerError'
    delete:
      tags:
      - ProfileEntry
      summary: Delete the ProfileEntry by ID
      deprecated: true
      description: Delete the single ProfileEntry for the given ID
      operationId: deleteProfileEntryById
      parameters:
      - description: ID of the ProfileEntry to delete
        in: path
        name: id
        required: true
        schema:
          type: string
          maxLength: 250
          pattern: ^[A-Za-z0-9\_\-\.]{0,250}$
      responses:
        '200':
          $ref: '#/components/responses/OK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        5XX:
          $ref: '#/components/responses/ServerError'
components:
  parameters:
    pageCount:
      description: maximum number of elements to retrieve
      explode: true
      in: query
      name: c
      example: '10'
      required: true
      schema:
        type: integer
        minimum: 1
        default: 20
        format: int32
      style: form
    pageIndex:
      description: index of the page to display
      explode: true
      in: query
      name: p
      example: '0'
      required: true
      schema:
        type: integer
        minimum: 0
        default: 0
        format: int32
      style: form
    pageFilter:
      description: can filter on attributes with the format f={filter\_name}={filter\_value} with the name/value pair as url encoded string.
      explode: true
      in: query
      name: f
      required: false
      schema:
        type: array
        items:
          type: string
          maxLength: 250
          pattern: ^[A-Za-z0-9%]{0,250}$
      style: form
      example: abc%3d123
    pageSearch:
      description: can search on attributes
      explode: true
      in: query
      name: s
      required: false
      schema:
        type: string
        maxLength: 250
        pattern: ^[A-Za-z0-9%]{0,250}$
      style: form
  responses:
    Unauthorized:
      description: Authorization information is missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Unauthorized
    OK:
      description: OK
    BadRequest:
      description: Bad request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Bad request
    NotFound:
      description: The resource for the specified ID was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Resource not found.
    Forbidden:
      description: Forbidden, The request contained valid data and was understood by the server, but the server is refusing action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Forbidden, The request contained valid data and was understood by the server, but the server is refusing action.
    ServerError:
      description: Unexpected error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: An unexpected error occured.
  schemas:
    ProfileEntry:
      type: object
      description: Profile entry
      properties:
        id:
          description: profileEntry id
          type: string
        icon:
          description: icon used in the portal to represent a profileEntry
          type: string
        index:
          description: position in a menu
          type: string
        profile_id:
          description: id of the profile that contains this profileEntry
          type: string
        page:
          description: pageToken (menu name or menu item name) used in a portal menu to identify the page associated with the profileEntry
          type: string
        description:
          description: description
          type: string
        name:
          description: name of the profileEntry
          type: string
        type:
          description: link (if menu item) | folder (if menu)
          type: string
        isCustom:
          description: ' true | false '
          type: boolean
        parent_id:
          description: id or parent profileEntry if in a folder
          type: string
    Error:
      type: object
      additionalProperties: true
      properties:
        message:
          type: string
          description: The error message
        exception:
          type: string
          description: The exception type
        explanations:
          description: Further details on the error
          type: array
          items:
            type: string
    ProfileEntryUpdateRequest:
      type: object
      properties:
        profile_id:
          description: id of the profile that contains this profileEntry
          type: string
        page:
          description: pageToken (menu name or menu item name) used in a portal menu to identify the page associated with the profileEntry
          type: string
        description:
          description: description
          type: string
        name:
          description: name of the profileEntry
          type: string
        type:
          description: link (if menu item) | folder (if menu)
          type: string
        isCustom:
          description: ' true | false '
          type: boolean
        parent_id:
          description: id or parent profileEntry if in a folder
          type: string
      example:
        page: tasklistingadmin
        parent_id: '0'
        name: Test menu
        profile_id: '102'
        type: link
        isCustom: false
    ProfileEntryCreateRequest:
      type: object
      properties:
        profile_id:
          description: id of the profile that contains this profileEntry
          type: string
        page:
          description: pageToken (menu name or menu item name) used in a portal menu to identify the page associated with the profileEntry
          type: string
        description:
          description: description
          type: string
        name:
          description: name of the profileEntry
          type: string
        type:
          description: link (if menu item) | folder (if menu)
          type: string
        isCustom:
          description: ' true | false '
          type: boolean
        parent_id:
          description: id or parent profileEntry if in a folder
          type: string
      example:
        page: tasklistingadmin
        parent_id: '0'
        name: Test menu
        profile_id: '102'
        type: link
        isCustom: false
  securitySchemes:
    bonita_auth:
      name: JSESSIONID
      description: 'To call the REST API, you must first log on with a user registered in the Engine database. Please refer to the __[Login API](#operation/login)__ operations section.

        '
      type: apiKey
      in: cookie
    bonita_token:
      name: X-Bonita-API-Token
      description: 'To call the REST API, you must first log on with a user registered in the Engine database. Please refer to the __[Login API](#operation/login)__ operations section.

        '
      type: apiKey
      in: header
    bearer_auth:
      description: '![edition](https://img.shields.io/badge/edition-entreprise-blue)


        When Bonita runtime is configured for SSO with openID Connect it is possible To call the REST API directly with a Bearer Authorization header containing the access token.

        '
      type: http
      scheme: bearer
