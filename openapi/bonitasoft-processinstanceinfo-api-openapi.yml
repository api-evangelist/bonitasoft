openapi: 3.2.0
info:
  license:
    name: GPL-v2.0
    url: http://www.gnu.org/licenses/gpl-2.0.txt
  version: 1.0.9
  title: Bonita Process Instance Info API
  description: 'Download OpenAPI specification

    Download Postman collection


    The REST API lets you access the data with HTTP requests; it is useful when implementing rich web forms / pages for a good user experience.'
  x-logo:
    url: images/ofelia-logo.svg
    backgroundColor: '#19465f'
    altText: Bonita API
    href: /
servers:
- url: http://localhost:8080/bonita
  description: Sample url for a local development server.
security:
- bonita_auth: []
  bonita_token: []
- bearer_auth: []
tags:
- name: ProcessInstanceInfo
  x-displayName: ProcessInstanceInfo
  description: ProcessInstanceInfo
paths:
  /API/bpm/caseInfo/{id}:
    get:
      tags:
      - ProcessInstanceInfo
      summary: Finds the ProcessInstanceInfo by ID
      description: '!edition since 2022.2


        Returns the single ProcessInstanceInfo for the given ID'
      operationId: getProcessInstanceInfoById
      parameters:
      - description: ID of the ProcessInstanceInfo to return
        in: path
        name: id
        required: true
        schema:
          type: string
          maxLength: 250
          pattern: ^[A-Za-z0-9\_\-\.]{0,250}$
      responses:
        '200':
          description: 'Success '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessInstanceInfo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        5XX:
          $ref: '#/components/responses/ServerError'
components:
  responses:
    Unauthorized:
      description: Authorization information is missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Unauthorized
    BadRequest:
      description: Bad request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Bad request
    NotFound:
      description: The resource for the specified ID was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Resource not found.
    Forbidden:
      description: Forbidden, The request contained valid data and was understood by the server, but the server is refusing action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Forbidden, The request contained valid data and was understood by the server, but the server is refusing action.
    ServerError:
      description: Unexpected error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: An unexpected error occured.
  schemas:
    Error:
      type: object
      additionalProperties: true
      properties:
        message:
          type: string
          description: The error message
        exception:
          type: string
          description: The exception type
        explanations:
          description: Further details on the error
          type: array
          items:
            type: string
    ProcessInstanceInfo:
      type: object
      description: 'Retrieves information about a process instances. It returns counters for each flow node in the process instances, showing the number of flow node instances that are in each state (possible states are: ready, executing, waiting, initializing, failed, completing, completed, skipped, cancelled, aborted). If there are no flow node instances in a given state, no counter is returned for that state for the flow node.'
      properties:
        id:
          description: case identifier
          type: string
        flowNodeStatesCounters:
          type: object
          description: flow nodes counters
          additionalProperties:
            type: object
            properties:
              completed:
                description: number of instance of the given Flow Node in completed state
                type: integer
                format: int64
              skipped:
                description: number of instance of the given Flow Node in skipped state
                type: integer
                format: int64
              cancelled:
                description: number of instance of the given Flow Node in cancelled state
                type: integer
                format: int64
              aborted:
                description: number of instance of the given Flow Node in aborted state
                type: integer
                format: int64
              ready:
                description: number of instance of the given Flow Node in ready state
                type: integer
                format: int64
              failed:
                description: number of instance of the given Flow Node in failed state
                type: integer
                format: int64
              executing:
                description: number of instance of the given Flow Node in executing state
                type: integer
                format: int64
              waiting:
                description: number of instance of the given Flow Node in waiting state
                type: integer
                format: int64
              initializing:
                description: number of instance of the given Flow Node in initializing state
                type: integer
                format: int64
              completing:
                description: number of instance of the given Flow Node in completing state
                type: integer
                format: int64
      example:
        id: 123
        flowNodeStatesCounters:
          Step1:
            completed: 2
            ready: 1
            executing: 5
          Step3:
            completed: 10
            failed: 2
  securitySchemes:
    bonita_auth:
      name: JSESSIONID
      description: 'To call the REST API, you must first log on with a user registered in the Engine database. Please refer to the __[Login API](#operation/login)__ operations section.

        '
      type: apiKey
      in: cookie
    bonita_token:
      name: X-Bonita-API-Token
      description: 'To call the REST API, you must first log on with a user registered in the Engine database. Please refer to the __[Login API](#operation/login)__ operations section.

        '
      type: apiKey
      in: header
    bearer_auth:
      description: '![edition](https://img.shields.io/badge/edition-entreprise-blue)


        When Bonita runtime is configured for SSO with openID Connect it is possible To call the REST API directly with a Bearer Authorization header containing the access token.

        '
      type: http
      scheme: bearer
