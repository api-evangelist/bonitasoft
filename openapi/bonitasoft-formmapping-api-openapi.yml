openapi: 3.2.0
info:
  license:
    name: GPL-v2.0
    url: http://www.gnu.org/licenses/gpl-2.0.txt
  version: 1.0.9
  title: Bonita Form Mapping API
  description: 'Download OpenAPI specification

    Download Postman collection


    The REST API lets you access the data with HTTP requests; it is useful when implementing rich web forms / pages for a good user experience.'
  x-logo:
    url: images/ofelia-logo.svg
    backgroundColor: '#19465f'
    altText: Bonita API
    href: /
servers:
- url: http://localhost:8080/bonita
  description: Sample url for a local development server.
security:
- bonita_auth: []
  bonita_token: []
- bearer_auth: []
tags:
- name: FormMapping
paths:
  /API/form/mapping:
    get:
      tags:
      - FormMapping
      summary: Finds FormMappings
      description: 'Finds FormMappings with pagination params and filters


        - can filter on `processDefinitionId`,`type`'
      operationId: searchFormMappings
      parameters:
      - $ref: '#/components/parameters/pageIndex'
      - $ref: '#/components/parameters/pageCount'
      - $ref: '#/components/parameters/pageFilter'
      - $ref: '#/components/parameters/pageOrder'
      - $ref: '#/components/parameters/pageSearch'
      responses:
        '200':
          description: 'Success '
          headers:
            Content-Range:
              schema:
                type: integer
                format: int64
              description: The total number of matching items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FormMapping'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        5XX:
          $ref: '#/components/responses/ServerError'
  /API/form/mapping/{id}:
    put:
      tags:
      - FormMapping
      summary: Update the FormMapping by ID
      deprecated: true
      description: '!edition


        Update the FormMapping for the given ID


        Warning: as of 9.0.0, updating a Form Mapping using this API is deprecated.'
      operationId: updateFormMappingById
      parameters:
      - description: ID of the FormMapping to return
        in: path
        name: id
        required: true
        schema:
          type: string
          maxLength: 250
          pattern: ^[A-Za-z0-9\_\-\.]{0,250}$
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FormMappingUpdateRequest'
        description: 'Representation of the form mapping attribute to update - {''pageId'': (long)} or {''url'': (string)} or {} to set the mapping type to NONE'
        required: true
      responses:
        '200':
          $ref: '#/components/responses/OK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        5XX:
          $ref: '#/components/responses/ServerError'
components:
  parameters:
    pageOrder:
      description: can order on attributes
      explode: true
      in: query
      name: o
      required: false
      schema:
        type: string
        maxLength: 250
        pattern: ^[A-Za-z0-9%]{0,250}$
      style: form
      example: myProp%20ASC
    pageCount:
      description: maximum number of elements to retrieve
      explode: true
      in: query
      name: c
      example: '10'
      required: true
      schema:
        type: integer
        minimum: 1
        default: 20
        format: int32
      style: form
    pageIndex:
      description: index of the page to display
      explode: true
      in: query
      name: p
      example: '0'
      required: true
      schema:
        type: integer
        minimum: 0
        default: 0
        format: int32
      style: form
    pageFilter:
      description: can filter on attributes with the format f={filter\_name}={filter\_value} with the name/value pair as url encoded string.
      explode: true
      in: query
      name: f
      required: false
      schema:
        type: array
        items:
          type: string
          maxLength: 250
          pattern: ^[A-Za-z0-9%]{0,250}$
      style: form
      example: abc%3d123
    pageSearch:
      description: can search on attributes
      explode: true
      in: query
      name: s
      required: false
      schema:
        type: string
        maxLength: 250
        pattern: ^[A-Za-z0-9%]{0,250}$
      style: form
  schemas:
    FormMapping:
      type: object
      description: Form Mapping specifies the mapping of a form to a process or a task. The mapping indicates the technology used to create the form, in the `target` attribute.
      properties:
        id:
          description: the form mapping identifier
          type: string
        processDefinitionId:
          description: the process identifier related to this form mapping
          type: string
        type:
          description: the form mapping type
          type: string
          enum:
          - PROCESSSTART
          - PROCESSOVERVIEW
          - TASK
        target:
          description: the target
          type: string
          enum:
          - URL
          - INTERNAL
          - LEGACY
          - UNDEFINED
          - NONE
        task:
          description: the task name when type is TASK - null otherwise
          type: string
        pageId:
          description: the custom page identifier when type is INTERNAL - null otherwise
          type: string
        pageMappingKey:
          description: the page mapping key part used to generate the form URL
          type: string
        lastUpdateBy:
          description: the identifier of the user who last updated this form mapping - 0 if no update has been done yet
          type: string
        lastUpdateDate:
          description: the last update date in milliseconds - null if no update has been done yet
          type: string
        url:
          description: the external URL (string) when type is URL - null otherwise
          type: string
      example:
        id: 5
        processDefinitionId: 7281286536417002000
        type: TASK
        target: URL
        task: Validate Feedback
        pageId: null
        pageMappingKey: taskInstance/myProcess/1.0/Validate Feedback
        lastUpdatedBy: 4
        lastUpdateDate: 1425295012666
        url: http://customerportal.bonitasoft.com
    Error:
      type: object
      additionalProperties: true
      properties:
        message:
          type: string
          description: The error message
        exception:
          type: string
          description: The exception type
        explanations:
          description: Further details on the error
          type: array
          items:
            type: string
    FormMappingUpdateRequest:
      type: object
      properties:
        pageId:
          description: pageId of the FormMapping
          type: string
        url:
          description: url of the FormMapping
          type: string
      example:
        pageId: '123'
        url: http://somewhe.re/over/the/rainbow
  responses:
    Unauthorized:
      description: Authorization information is missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Unauthorized
    OK:
      description: OK
    BadRequest:
      description: Bad request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Bad request
    NotFound:
      description: The resource for the specified ID was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Resource not found.
    Forbidden:
      description: Forbidden, The request contained valid data and was understood by the server, but the server is refusing action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Forbidden, The request contained valid data and was understood by the server, but the server is refusing action.
    ServerError:
      description: Unexpected error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: An unexpected error occured.
  securitySchemes:
    bonita_auth:
      name: JSESSIONID
      description: 'To call the REST API, you must first log on with a user registered in the Engine database. Please refer to the __[Login API](#operation/login)__ operations section.

        '
      type: apiKey
      in: cookie
    bonita_token:
      name: X-Bonita-API-Token
      description: 'To call the REST API, you must first log on with a user registered in the Engine database. Please refer to the __[Login API](#operation/login)__ operations section.

        '
      type: apiKey
      in: header
    bearer_auth:
      description: '![edition](https://img.shields.io/badge/edition-entreprise-blue)


        When Bonita runtime is configured for SSO with openID Connect it is possible To call the REST API directly with a Bearer Authorization header containing the access token.

        '
      type: http
      scheme: bearer
