openapi: 3.2.0
info:
  license:
    name: GPL-v2.0
    url: http://www.gnu.org/licenses/gpl-2.0.txt
  version: 1.0.9
  title: Bonita Professional Contact Data API
  description: 'Download OpenAPI specification

    Download Postman collection


    The REST API lets you access the data with HTTP requests; it is useful when implementing rich web forms / pages for a good user experience.'
  x-logo:
    url: images/ofelia-logo.svg
    backgroundColor: '#19465f'
    altText: Bonita API
    href: /
servers:
- url: http://localhost:8080/bonita
  description: Sample url for a local development server.
security:
- bonita_auth: []
  bonita_token: []
- bearer_auth: []
tags:
- name: ProfessionalContactData
  x-displayName: ProfessionalContactData
  description: ProfessionalContactData
paths:
  /API/identity/professionalcontactdata:
    get:
      tags:
      - ProfessionalContactData
      summary: Finds ProfessionalContactData
      description: 'Finds ProfessionalContactData with pagination params and filters


        - can order on `id`

        - can search on `displayName`

        - can filter on `displayName`'
      operationId: searchProfessionalContactDatas
      parameters:
      - $ref: '#/components/parameters/pageIndex'
      - $ref: '#/components/parameters/pageCount'
      - $ref: '#/components/parameters/pageFilter'
      - $ref: '#/components/parameters/pageOrder'
      - $ref: '#/components/parameters/pageSearch'
      responses:
        '200':
          description: Success
          headers:
            Content-Range:
              schema:
                type: integer
                format: int64
              description: The total number of matching items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProfessionalContactData'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        5XX:
          $ref: '#/components/responses/ServerError'
    post:
      tags:
      - ProfessionalContactData
      summary: Create the ProfessionalContactData
      operationId: createProfessionalContactData
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfessionalContactData'
            example:
              id: '4'
              fax_number: 484-302-0766
              building: '70'
              phone_number: 484-302-5766
              zipcode: '19108'
              state: PA
              city: Philadelphia
              country: United States
              address: Renwick Drive
              email: walter.bates@acme.com
        description: Partial ProfessionalContactData description including the user ID
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfessionalContactData'
          description: Success
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Contact information for this user already exists
        5XX:
          $ref: '#/components/responses/ServerError'
      x-codegen-request-body-name: body
  /API/identity/professionalcontactdata/{userId}:
    get:
      tags:
      - ProfessionalContactData
      summary: Finds the ProfessionalContactData by ID
      description: Returns the single ProfessionalContactData for the given ID
      operationId: getProfessionalContactDataById
      parameters:
      - description: User ID of the ProfessionalContactData to return
        in: path
        name: userId
        required: true
        schema:
          type: string
          maxLength: 250
          pattern: ^[A-Za-z0-9\_\-\.]{0,250}$
      responses:
        '200':
          description: 'Success '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfessionalContactData'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        5XX:
          $ref: '#/components/responses/ServerError'
    put:
      tags:
      - ProfessionalContactData
      summary: Update the ProfessionalContactData by ID
      description: Update the ProfessionalContactData for the given ID
      operationId: updateProfessionalContactDataById
      parameters:
      - description: User ID of the ProfessionalContactData to update
        in: path
        name: userId
        required: true
        schema:
          type: string
          maxLength: 250
          pattern: ^[A-Za-z0-9\_\-\.]{0,250}$
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfessionalContactData'
            example:
              id: '4'
              fax_number: 484-302-0766
              building: '70'
              phone_number: 484-302-5766
              zipcode: '19108'
              state: PA
              city: Philadelphia
              country: United States
              address: Renwick Drive
              email: walter.bates@acme.com
        description: Partial ProfessionalContactData description including the user ID
        required: true
      responses:
        '200':
          $ref: '#/components/responses/OK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        5XX:
          $ref: '#/components/responses/ServerError'
  /API/identity/personalcontactdata/{userId}:
    get:
      tags:
      - ProfessionalContactData
      summary: Finds the PersonalContactData by ID
      description: Returns the single PersonalContactData for the given ID
      operationId: getPersonalContactDataById
      parameters:
      - description: User ID of the PersonalContactData to return
