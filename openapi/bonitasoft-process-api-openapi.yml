openapi: 3.2.0
info:
  license:
    name: GPL-v2.0
    url: http://www.gnu.org/licenses/gpl-2.0.txt
  version: 1.0.9
  title: Bonita Process API
  description: 'Download OpenAPI specification

    Download Postman collection


    The REST API lets you access the data with HTTP requests; it is useful when implementing rich web forms / pages for a good user experience.'
  x-logo:
    url: images/ofelia-logo.svg
    backgroundColor: '#19465f'
    altText: Bonita API
    href: /
servers:
- url: http://localhost:8080/bonita
  description: Sample url for a local development server.
security:
- bonita_auth: []
  bonita_token: []
- bearer_auth: []
tags:
- name: Process
  x-displayName: Process
  description: Deploy and manage process definitions. In addition, you can instantiate a process, which will create a new process instance (case).
paths:
  /API/bpm/process:
    get:
      tags:
      - Process
      summary: Finds Processes
      description: 'Finds Processes with pagination params and filters


        - can order (default is ASC) on `name`, `version`, `deploymentDate`, `deployedBy`, `activationState`, `configurationState`, `processId`, `displayName`, `lastUpdateDate`, `categoryId`, `label`

        - can search on `name`, `displayName` or `version`

        - can filter on `name`, `version`, `deploymentDate`, `deployedBy`, `activationState` with the value DISABLED or ENABLED, `configurationState` with the value UNRESOLVED, or RESOLVED, `processId`, `displayName`, `lastUpdateDate`, `categoryId`, `label`, `supervisor_id`'
      operationId: searchProcesses
      parameters:
      - $ref: '#/components/parameters/pageIndex'
      - $ref: '#/components/parameters/pageCount'
      - $ref: '#/components/parameters/pageFilter'
      - $ref: '#/components/parameters/pageOrder'
      - $ref: '#/components/parameters/pageSearch'
      responses:
        '200':
          description: 'Success '
          headers:
            Content-Range:
              schema:
                type: integer
                format: int64
              description: The total number of matching items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProcessDefinition'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        5XX:
          $ref: '#/components/responses/ServerError'
    post:
      tags:
      - Process
      summary: Create the Process
      deprecated: true
      description: 'Create the Process.

        A process resource is created using the content of a .bar file that has previously been uploaded, using the processUpload servlet, to get the process archive path.


        Warning: as of 9.0.0, creating a process using this API is deprecated.'
      operationId: createProcess
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessCreateRequest'
        description: Partial Process description
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessDefinition'
          description: 'Success '
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        5XX:
          $ref: '#/components/responses/ServerError'
      x-codegen-request-body-name: body
    delete:
      tags:
      - Process
      summary: Delete the Process by IDs
      description: 'Delete Process for the given list of ID.


        **Warning: Beware! Data loss risk!**


        Deleting a process will automatically delete all its process instances (on-going and archived alike).

        Thus, the operation may take a long time, and fail if the transaction timeout is not large enough. This feature should only be used on non-production environments.


        **Please proceed at your own risk.**'
      operationId: deleteProcessByIds
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
            example:
            - '1'
            - '2'
            - '3'
      responses:
        '200':
          $ref: '#/components/responses/OK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        5XX:
          $ref: '#/components/responses/ServerError'
  /API/bpm/process/{id}:
    get:
      tags:
      - Process
      summary: Finds the Process by ID
      description: Returns the single Process for the given ID
      operationId: getProcessById
      parameters:
      - description: ID of the Process to return
        in: path
        name: id
        required: true
        schema:
          type: string
          maxLength: 250
          pattern: ^[A-Za-z0-9\_\-\.]{0,250}$
      responses:
        '200':
          description: 'Success '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessDefinition'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        5XX:
          $ref: '#/components/responses/ServerError'
    put:
      tags:
      - Process
      summary: Update the Process by ID
      deprecated: true
      description: 'Update the Process for the given ID


        Warning: as of 9.0.0, updating a process using this API is deprecated.'
      operationId: updateProcessById
      parameters:
      - description: ID of the Process to return
        in: path
        name: id
        required: true
        schema:
          type: string
          maxLength: 250
          pattern: ^[A-Za-z0-9\_\-\.]{0,250}$
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessUpdateRequest'
        description: Partial Process description
        required: true
      responses:
        '200':
          $ref: '#/components/responses/OK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        5XX:
          $ref: '#/components/responses/ServerError'
    delete:
      tags:
      - Process
      summary: Delete the Process by ID
      description: 'Delete the single Process for the given ID.


        **Warning: Beware! Data loss risk!**


        Deleting a process will automatically delete all its process instances (on-going and archived alike).

        Thus, the operation may take a long time, and fail if the transaction timeout is not large enough. This feature should only be used on non-production environments.


        **Please proceed at your own risk.**'
      operationId: deleteProcessById
      parameters:
      - description: ID of the Process to delete
        in: path
        name: id
        required: true
        schema:
          type: string
          maxLength: 250
          pattern: ^[A-Za-z0-9\_\-\.]{0,250}$
      responses:
        '200':
          $ref: '#/components/responses/OK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        5XX:
          $ref: '#/components/responses/ServerError'
  /API/bpm/process/{id}/design:
    get:
      tags:
      - Process
      summary: Finds the Process design by ID
      description: Returns the single Process design for the given ID
      operationId: getProcessDesignById
      parameters:
      - description: ID of the Process to get the design from
        in: path
        name: id
        required: true
        schema:
          type: string
          maxLength: 250
          pattern: ^[A-Za-z0-9\_\-\.]{0,250}$
      responses:
        '200':
          description: 'Success '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DesignProcessDefinition'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        5XX:
          $ref: '#/components/responses/ServerError'
  /API/bpm/process/{id}/contract:
    get:
      tags:
      - Process
      summary: Finds the Process contract by ID
      description: Returns the process contract for the given ID
      operationId: getProcessContractById
      parameters:
      - description: ID of the Process to get the contract from
        in: path
        name: id
        required: true
        schema:
          type: string
          maxLength: 250
          pattern: ^[A-Za-z0-9\_\-\.]{0,250}$
      responses:
        '200':
          description: 'Success '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contract'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        5XX:
          $ref: '#/components/responses/ServerError'
  /API/bpm/process/{id}/instantiation:
    post:
      tags:
      - Process
      summary: Instanciate the process
      description: Instanciate the process with the provided contract values.
      operationId: instanciateProcess
      parameters:
      - name: id
        description: ID of the process to instanciate
        in: path
        required: true
        schema:
          type: string
          maxLength: 250
          pattern: ^[A-Za-z0-9\_\-\.]{0,250}$
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
            example:
              ticket_account: CustomerA
              ticket_description: issue description
              ticket_subject: Issue 1
        description: A JSON object matching process contract.
        required: true
      responses:
        '201':
          description: Return the created process instance ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessInstantiationResponse'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Error'
              example:
                message: 'USERNAME=walter.bates | Contract is not valid: '
                exception: class org.bonitasoft.engine.bpm.contract.ContractViolationException
                explanations:
                - Expected input [ticket_account] is missing
                - Expected input [ticket_description] is missing
                - Expected input [ticket_subject] is missing
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          description: Case creation limit reached (Community 2024.3+ only)
          headers:
            Retry-After:
              schema:
                type: string
                format: date-time
              description: Date when case counter will be refilled
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: number
                    description: The response status code
                  description:
                    type: string
                    description: The status description
                  reasonPhrase:
                    type: string
                    description: The detail of the reason
              example:
                code: 429
                description: Unable to start the process with ID 5524355418393634511
                reasonPhrase: Case creation limit reached.
        5XX:
          $ref: '#/components/responses/ServerError'
      x-codegen-request-body-name: body
  /API/bpm/processName:
    get:
      tags:
      - Process
      summary: Search process names
      description: 'Searches process deployment information grouped by `(name, displayName)`, returning one entry per

        distinct name and display name, each carrying the list of its deployed versions.


        - can order on `displayName` or `name` (default is `displayName ASC`). A single sort clause is

        applied: a compound order such as `displayName ASC, name DESC` is rejected with a `400`.

        - can search (`s`) on `name` or `displayName`. The term selects which groups are returned; a

        returned group always lists all of its versions allowed by the `activationState` filter.

        - can filter on `activationState` with the value `ENABLED` or `DISABLED`. An unknown value is

        rejected with a `400`; other filter keys are ignored.


        The `Content-Range` header reports the total number of groups, not the number of versions.'
      operationId: searchProcessNames
      parameters:
      - $ref: '#/components/parameters/pageIndex'
      - $ref: '#/components/parameters/pageCount'
      - $ref: '#/components/parameters/pageFilter'
      - $ref: '#/components/parameters/pageOrder'
      - $ref: '#/components/parameters/pageSearch'
      responses:
        '200':
          description: Successful operation
          headers:
            Content-Range:
              schema:
                type: integer
                format: int64
              description: The total number of matching groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProcessName'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        5XX:
          $ref: '#/components/responses/ServerError'
  /API/bpm/processConnector/{id}/{connectorImplId}/{connectorImplVersion}:
    put:
      tags:
      - Process
      summary: Update the Process Connector by Process ID
      deprecated: true
      description: '!edition


        Update the ProcessConnector for the given ID


        Warning: as of 9.0.0, updating a Process Connector using this API is deprecated.'
      operationId: updateProcessConnectorByProcessId
      parameters:
      - description: ID of the process to update
        in: path
        name: id
        required: true
        schema:
          type: string
          maxLength: 250
          pattern: ^[A-Za-z0-9\_\-\.]{0,250}$
      - description: ID of the Process Connector implementation to update
        in: path
        name: connectorImplId
        required: true
        schema:
          type: string
          maxLength: 250
          pattern: ^[A-Za-z0-9\_\-\.]{0,250}$
      - description: Version of the Process Connector implementation to update
        in: path
        name: connectorImplVersion
        required: true
        schema:
          type: string
          maxLength: 250
          pattern: ^[A-Za-z0-9\_\-\.]{0,250}$
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProcessConnectorByProcessIdRequest'
        description: Partial ProcessConnector description
        required: true
      responses:
        '200':
          $ref: '#/components/responses/OK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        5XX:
          $ref: '#/components/responses/ServerError'
  /portal/processUpload:
    post:
      tags:
      - Process
      deprecated: true
      summary: Upload a bar file
      description: 'Upload a bar file


        Warning: as of 9.0.0, uploading a bar file using the portal is deprecated.'
      operationId: uploadProcess
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FileUploadRequest'
      responses:
        '200':
          description: the temporary file name once uploaded on the server
          content:
            text/plain:
              schema:
                type: string
                maxLength: 250
                pattern: ^[A-Za-z0-9\_\-\.]{0,250}$
                example: tmp_11199343585454336281.bar
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        5XX:
          $ref: '#/components/responses/ServerError'
components:
  parameters:
    pageCount:
      description: maximum number of elements to retrieve
      explode: true
      in: query
      name: c
      example: '10'
      required: true
      schema:
        type: integer
        minimum: 1
        default: 20
        format: int32
      style: form
    pageFilter:
      description: can filter on attributes with the format f={filter\_name}={filter\_value} with the name/value pair as url encoded string.
      explode: true
      in: query
      name: f
      required: false
      schema:
        type: array
        items:
          type: string
          maxLength: 250
          pattern: ^[A-Za-z0-9%]{0,250}$
      style: form
      example: abc%3d123
    pageSearch:
      description: can search on attributes
      explode: true
      in: query
      name: s
      required: false
      schema:
        type: string
        maxLength: 250
        pattern: ^[A-Za-z0-9%]{0,250}$
      style: form
    pageIndex:
      description: index of the page to display
      explode: true
      in: query
      name: p
      example: '0'
      required: true
      schema:
        type: integer
        minimum: 0
        default: 0
        format: int32
      style: form
    pageOrder:
      description: can order on attributes
      explode: true
      in: query
      name: o
      required: false
      schema:
        type: string
        maxLength: 250
        pattern: ^[A-Za-z0-9%]{0,250}$
      style: form
      example: myProp%20ASC
  responses:
    Unauthorized:
      description: Authorization information is missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Unauthorized
    OK:
      description: OK
    Forbidden:
      description: Forbidden, The request contained valid data and was understood by the server, but the server is refusing action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Forbidden, The request contained valid data and was understood by the server, but the server is refusing action.
    NotFound:
      description: The resource for the specified ID was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Resource not found.
    ServerError:
      description: Unexpected error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: An unexpected error occured.
    BadRequest:
      description: Bad request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Bad request
  schemas:
    FileUploadRequest:
      type: object
      description: The file to upload
      properties:
        file:
          type: string
          format: binary
    ConfigurationState:
      description: the configuration state of the process (UNRESOLVED or RESOLVED)
      type: string
      enum:
      - RESOLVED
      - UNRESOLVED
    ProcessCreateRequest:
      type: object
      properties:
        fileupload:
          description: the bar file to deploy (previously uploaded in tmp folder)
          type: string
      example:
        fileupload: tmp_4431838172282406107.bar
    ContractConstraint:
      type: object
      properties:
        name:
          description: constraint name
          type: string
        expression:
          description: constraint expression
          type: string
        explanation:
          description: constraint explanation
          type: string
        inputNames:
          type: array
          items:
            type: string
    FlowElementContainerDefinition:
      type: object
      description: Allows to access all flow elements (activities, gateways, events and transitions) of a process or sub-process.
      properties:
        activities:
          type: array
          items:
            type: object
            additionalProperties: true
        transitions:
          type: array
          items:
            type: object
            additionalProperties: true
        gatewaysList:
          type: array
          items:
            type: object
            additionalProperties: true
        startEvents:
          type: array
          items:
            type: object
            additionalProperties: true
        intermediateCatchEvents:
          type: array
          items:
            type: object
            additionalProperties: true
        intermediateThrowEvents:
          type: array
          items:
            type: object
            additionalProperties: true
        endEvents:
          type: array
          items:
            type: object
            additionalProperties: true
        dataDefinitions:
          type: array
          items:
            type: object
            additionalProperties: true
        documentDefinitions:
          type: array
          items:
            type: object
            additionalProperties: true
        connectors:
          type: array
          items:
            type: object
            additionalProperties: true
        businessDataDefinitions:
          type: array
          items:
            type: object
            additionalProperties: true
        documentListDefinitions:
          type: array
          items:
            type: object
            additionalProperties: true
    ActivationState:
      description: the state of the process definition (ENABLED or DISABLED)
      type: string
      enum:
      - ENABLED
      - DISABLED
    ProcessName:
      type: object
      description: 'A group of deployed processes that share the same `(name, displayName)` pair, with the list of

        their deployed versions. Returned by `GET /API/bpm/processName`, which collapses the process

        deployment information into one entry per distinct name and display name.

        '
      required:
      - name
      - displayName
      - versions
      properties:
        name:
          description: Technical name shared by every version in this group.
          type: string
        displayName:
          description: Human-readable name shared by every version in this group. Defaults to the process technical name when no display name was set at deployment.
          type: string
        versions:
          description: 'Deployed versions of the process sharing this name and display name. When an `activationState`

            filter is supplied, only the versions in that state are listed. Always contains at least one entry.

            '
          type: array
          minItems: 1
          items:
            type: string
      example:
        name: InvoiceApproval
        displayName: Invoice Approval
        versions:
        - '1.0'
        - '1.1'
        - '2.0'
    ContractInputType:
      type: string
      description: the contract input type (string)
      enum:
      - TEXT
      - BOOLEAN
      - DATE
      - INTEGER
      - DECIMAL
      - BYTE_ARRAY
      - FILE
      - LONG
      - LOCALDATE
      - LOCALDATETIME
      - OFFSETDATETIME
    DesignProcessDefinitionContext:
      type: object
      description: The process definition expressions
      properties:
        key:
          type: string
        expression:
          $ref: '#/components/schemas/Expression'
    DesignProcessDefinition:
      type: object
      description: Represents the Design Definition of a process. It gives access to process attributes.
      properties:
        displayName:
          description: The process definition display name
          type: string
        displayDescription:
          description: The process definition display description name
          type: string
        flowElementContainer:
          $ref: '#/components/schemas/FlowElementContainerDefinition'
        parameters:
          description: The process parameter definitions
          type: array
          items:
            $ref: '#/components/schemas/DesignProcessDefinitionParamater'
        actorsList:
          description: The list of process actor definitions
          type: array
          items:
            $ref: '#/components/schemas/ActorDefinition'
        actorInitiator:
          $ref: '#/components/schemas/ActorDefinition'
        stringIndexLabels:
          description: The process definition labels
          type: array
          items:
            type: string
        stringIndexValues:
          description: The process definition expressions
          type: array
          items:
            $ref: '#/components/schemas/Expression'
        contract:
          description: the process instantiation contract
          $ref: '#/components/schemas/Contract'
        context:
          description: The process definition expressions
          type: array
          items:
            $ref: '#/components/schemas/DesignProcessDefinitionContext'
    UpdateProcessConnectorByProcessIdRequest:
      type: object
      properties:
        id:
          description: Id of the process for which to update the connector, combined with connector name and version separated by slashes (x/y/z)
          type: string
        implementation:
          description: Previously uploaded temp file name of the updated version of the connector (returned by the  [upload file api](#operation/uploadFile))
          type: string
      example:
        id: 8491796209115952722/scripting-groovy-script/1.0.1
        implementation: tmp_7006630415905915150.zip
    Error:
      type: object
      additionalProperties: true
      properties:
        message:
          type: string
          description: The error message
        exception:
          type: string
          description: The exception type
        explanations:
          description: Further details on the error
          type: array
          items:
            type: string
    ContractInput:
      type: object
      properties:
        description:
          description: input description
          type: string
        name:
          description: input name
          type: string
        multiple:
          description: true if input contains multiple values
          type: string
        type:
          $ref: '#/components/schemas/ContractInputType'
        inputs:
          type: array
          items:
            $ref: '#/components/schemas/ContractInput'
    Expression:
      type: object
      properties:
        id:
          description: the expression id
          type: string
        name:
          description: the expression name
          type: string
        content:
          description: the expression content
          type: string
        expressionType:
          description: the expression type
          type: string
        returnType:
          description: the expression return type
          type: string
        interpreter:
          description: the expression interpreter
          type: string
        dependencies:
          description: the expression dependencies
          type: array
          items:
            $ref: '#/components/schemas/Expression'
    ProcessUpdateRequest:
      type: object
      properties:
        displaydescription:
          description: description of the Process
          type: string
        displayName:
          description: display name of the Process
          type: string
        activationState:
