openapi: 3.2.0
info:
  license:
    name: GPL-v2.0
    url: http://www.gnu.org/licenses/gpl-2.0.txt
  version: 1.0.9
  title: Bonita Information API
  description: 'Download OpenAPI specification

    Download Postman collection


    The REST API lets you access the data with HTTP requests; it is useful when implementing rich web forms / pages for a good user experience.'
  x-logo:
    url: images/ofelia-logo.svg
    backgroundColor: '#19465f'
    altText: Bonita API
    href: /
servers:
- url: http://localhost:8080/bonita
  description: Sample url for a local development server.
security:
- bonita_auth: []
  bonita_token: []
- bearer_auth: []
tags:
- name: Information
  x-displayName: Information
  description: 'Handle the platform information.

    This Web REST API is available since version 10.2 (2024.3). Most of the information returned is only for Subscription editions.'
paths:
  /API/system/information:
    get:
      tags:
      - Information
      summary: Get the system information
      description: 'Returns system information details of the platform.

        Requires to be logged in as a user having the Admin profile.'
      operationId: getSystemInformation
      x-codeSamples:
      - lang: Shell
        label: Curl
        source: 'curl -b saved_cookies.txt -X GET --url ''http://localhost:8080/bonita/API/system/information''

          '
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemInformation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        5XX:
          $ref: '#/components/responses/ServerError'
components:
  responses:
    Unauthorized:
      description: Authorization information is missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Unauthorized
    BadRequest:
      description: Bad request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Bad request
    Forbidden:
      description: Forbidden, The request contained valid data and was understood by the server, but the server is refusing action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Forbidden, The request contained valid data and was understood by the server, but the server is refusing action.
    ServerError:
      description: Unexpected error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: An unexpected error occured.
  schemas:
    SystemInformation:
      type: object
      description: ''
      properties:
        licenseStartDate:
          description: date in milliseconds timestamp since Epoch - first day (included) of license file validity - Subscription editions only
          type: string
        duration:
          description: number of days for license file validity - Subscription editions only
          type: string
        licenseExpirationDate:
          description: date in milliseconds timestamp since Epoch - last day (included) of license file validity - Subscription editions only
          type: string
        numberOfCPUCores:
          description: number of CPUs allowed by the license, if license mode is CPU-based - Subscription editions only
          type: string
        edition:
          description: name of the Bonita edition enabled by the license - Community & Subscription editions
          type: string
        subscriptionType:
          description: type of the Subscription the customer has purchased with Ofelia - Subscription editions only
          type: string
        licenseMode:
          description: available mode enabled by the license - Subscription editions only
          type: string
        managedAppsLimit:
          description: number of managed apps provisioned for in a Bonita Central environment - Subscription editions only
          type: integer
          format: int64
        licensee:
          description: Owner of the license - Subscription editions only
          type: string
        contactInfo:
          description: E-mail address of the owner of the license - Subscription editions only
          type: string
        expirationDate:
          description: License expiration date in milliseconds timestamp since Epoch - Subscription editions only
          type: integer
          format: int64
        activeFeatures:
          description: List of active features that the license allow access to (separated by comma) - Subscription editions only
          type: string
        requestKey:
          description: "request key to use to generate a new license on the customer portal.  \n\nIf you have a subscription that specifies case-counter licensing, additional fields are present:\n"
          type: string
        subscriptionStartPeriod:
          description: date in milliseconds timestamp since Epoch - first day (included) of current period for number of process instances provisioned - Subscription editions only
          type: string
        subscriptionEndPeriod:
          description: date in milliseconds timestamp since Epoch - last day (included) of current period for number of process instances provisioned - Subscription editions only
          type: string
        caseCounterLimit:
          description: number of maximum process instances that can be started - Community & Subscription editions
          type: integer
          format: int64
        caseCounter:
          description: number of consumed process instances - Community & Subscription editions
          type: integer
          format: int64
    Error:
      type: object
      additionalProperties: true
      properties:
        message:
          type: string
          description: The error message
        exception:
          type: string
          description: The exception type
        explanations:
          description: Further details on the error
          type: array
          items:
            type: string
  securitySchemes:
    bonita_auth:
      name: JSESSIONID
      description: 'To call the REST API, you must first log on with a user registered in the Engine database. Please refer to the __[Login API](#operation/login)__ operations section.

        '
      type: apiKey
      in: cookie
    bonita_token:
      name: X-Bonita-API-Token
      description: 'To call the REST API, you must first log on with a user registered in the Engine database. Please refer to the __[Login API](#operation/login)__ operations section.

        '
      type: apiKey
      in: header
    bearer_auth:
      description: '![edition](https://img.shields.io/badge/edition-entreprise-blue)


        When Bonita runtime is configured for SSO with openID Connect it is possible To call the REST API directly with a Bearer Authorization header containing the access token.

        '
      type: http
      scheme: bearer
