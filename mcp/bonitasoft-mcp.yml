generated: '2026-08-17'
method: derived
status: candidate
source: >-
  Derived from openapi/bonitasoft-bonita-openapi.yml (Bonita API 1.0.9, OpenAPI
  3.0.2, 153 paths / 224 operations). No Bonitasoft- or Ofelia-published MCP
  server exists as of 2026-08-17.
search_evidence:
  checked: '2026-08-17'
  findings: >-
    Searched the github.com/bonitasoft organization (157 public repositories, 0
    matches for "mcp" via the GitHub repository search API), the Bonita and
    Bonita Cloud documentation sitemaps (3,508 + 30 URLs, no MCP page), npm
    (@modelcontextprotocol and @bonitasoft scopes), and the product/pricing
    pages for Ofelia Assistant, Ofelia Workflow and Ofelia Agentic. Nothing
    advertises a Model Context Protocol server, hosted or stdio.
  adjacent_but_not_mcp: >-
    The company does ship AI plumbing on the OTHER side of the boundary: a
    first-party AI connector (org.bonitasoft.connectors:bonita-connector-ai
    1.0.0, 2025-04-25) and a bonita-connector-ai-agent repository let a Bonita
    process CALL a model. That makes Bonita an MCP *client*-side consumer of AI,
    not an MCP server an external agent can call. The Ofelia Agentic line
    announced at the June 2026 rebrand is in private preview with general
    availability stated for early 2027, so its agent surface — if it exposes one
    — is not yet observable.

deployment:
  mode: none
  auth: unknown
  verified: derived
  note: >-
    mode is `none` because nobody ships a server: there is no endpoint to POST
    to and no package to install. endpoint/install/package are deliberately
    absent rather than guessed. If a Bonita MCP server ever ships it will most
    likely be self-hosted alongside the runtime (like the REST API itself), in
    which case `mode` becomes local-stdio or a per-deployment remote, never a
    single vendor-operated URL.

server:
  name: bonita
  transport: null
  url: null
  note: >-
    A hypothetical server would front <customer-host>/bonita/API and inherit
    Bonita's session model (POST /loginservice for a JSESSIONID plus the
    X-Bonita-API-Token CSRF header on every write), or the Enterprise
    OIDC bearer token. See authentication/bonitasoft-authentication.yml.

coverage:
  candidate_tool_count: 224
  categories: 75
  read_operations: 122
  write_operations: 102
  deprecated_operations: 33
  note: >-
    One candidate tool per real operationId, grouped by the operation's first
    OpenAPI tag. 33 tools are marked `deprecated: true` because the backing
    operation is marked deprecated in the spec — a real server should not expose
    those. Each tool's REAL inputSchema is the backing operation's `parameters`
    plus `requestBody` in openapi/bonitasoft-bonita-openapi.yml; it is not
    duplicated here.

