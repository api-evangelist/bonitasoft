method: searched
source: >-
  Registry sweeps of Maven Central (search.maven.org/solrsearch), npm
  (registry.npmjs.org search + per-package metadata), Docker Hub
  (hub.docker.com/v2/repositories/library/bonita), PyPI, RubyGems, crates.io,
  NuGet and pkg.go.dev, plus the Bonita OpenAPI description (which names the
  official Java client) and the github.com/bonitasoft organization (157 public
  repositories).
summary:
  first_party_sdk_count: 1
  first_party_package_count: 16
  primary_language: java
  note: >-
    Bonitasoft (Ofelia since June 2026) is a Java shop. The one true API client
    library is org.bonitasoft.web:bonita-java-client on Maven Central — the
    Bonita OpenAPI document itself names it as "an open source java client
    implemented above the HTTP API". There is no first-party JavaScript, Python,
    Go, Ruby, PHP or .NET client for the Bonita Web REST API; non-Java consumers
    are directed at raw REST plus the published OpenAPI/Postman artifacts, which
    is stated verbatim in the spec description. The @bonitasoft npm scope is UI
    Designer widget tooling and web components, not REST clients (see
    components/bonitasoft-components.yml).
  currency_note: >-
    bonita-java-client 3.0.1 was published 2025-03-21, while the API contract it
    wraps shipped 1.0.9 on 2026-06-19 and the runtime shipped 2026.2 on
    2026-06-30. The client's develop branch is active (pushed 2026-07-27) but no
    release has been cut since March 2025, so the published client lags the
    published contract by roughly fifteen months.

