source: live probes of /.well-known/ on every Bonitasoft/Ofelia host, 2026-08-17
summary: >-
  ZERO documents found. Every /.well-known/ path returns 404 on every host the
  company controls — the marketing site (www.ofelia.com and the legacy
  www.bonitasoft.com, which 301s to it), the documentation site
  (documentation.ofelia.com), the API reference host
  (api-documentation.ofelia.com) and the community forum
  (community.ofelia.com). No security.txt, no OIDC discovery, no RFC 8414/9728
  OAuth metadata, no api-catalog, no ai-plugin.json, and no A2A agent card at
  either the canonical or legacy path.
pointer_basis: >-
  NO WellKnown pointer and NO SecurityTxt pointer are emitted from this file.
  Nothing returned a 200 carrying a real document, so there is no provider
  surface to point at. This file records a measured absence, which is valid
  data — it is not evidence of a served well-known surface.
architectural_note: >-
  Part of this absence is structural rather than neglect. Bonita is software the
  customer runs: the REST API lives at <customer-host>/bonita/API, so any
  /.well-known/ discovery surface would have to be served by each deployment,
  not by the vendor. There is no vendor-operated API host to serve it from. The
  OIDC discovery document a Bonita Enterprise deployment consumes belongs to the
  customer's own identity provider (see
  documentation.ofelia.com/bonita/latest/identity/single-sign-on-with-oidc), not
  to Bonitasoft. What is genuinely missing and IS the vendor's to fix is
  /.well-known/security.txt on ofelia.com — the company publishes a real
  vulnerability reporting policy (product-security@ofelia.com) but does not
  advertise it via RFC 9116.
false_positive_watch: >-
  bonita.cloud answers HTTP 200 with a 114-byte HTML redirect stub for EVERY
  path, including /.well-known/agent-card.json, and serves a text/plain
  /llms.txt. It is NOT a Bonitasoft host: the llms.txt says the domain is listed
  for sale on GoDaddy's aftermarket, and the stub redirects to /lander. Bonita
  Cloud actually runs on *.bonitacloud.com (per
  documentation.ofelia.com/cloud/latest/manage/url-customization). Any future
  round that treats a bonita.cloud 200 as a Bonitasoft document is wrong.

