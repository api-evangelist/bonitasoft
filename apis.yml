aid: bonitasoft
name: Bonitasoft
description: >-
  Bonitasoft is the French open-source company behind Bonita, a business process
  management and process automation platform used to model BPMN processes, build
  living applications, and orchestrate work across an organization. Bonita ships
  as Bonita Studio, Bonita Fabric (Process Designer, BPA Studio, UI Builder),
  Bonita Work Hub and the Bonita Runtime, in a free Community Edition and a
  commercial Enterprise Edition, plus a managed Bonita Cloud offering. Every
  Bonita feature reachable over HTTP is described by a single first-party
  OpenAPI 3.0.2 document — the Bonita Web REST API, 153 paths and 224
  operations across BPM, identity, application, BDM and platform resources —
  published as an open-source repository, a versioned release asset and a live
  ReDoc reference. In June 2026 the company rebranded to Ofelia and moved its
  web, documentation and community properties from bonitasoft.com to
  ofelia.com, adding a governed agentic AI orchestration line (Ofelia Assistant,
  Ofelia Workflow, Ofelia Agentic) alongside the Bonita BPM platform.
image: https://cdn.prod.website-files.com/69babab287a7d4136d9c544a/69babbfcdec6f9319562e4b1_Opengraph.png
url: https://raw.githubusercontent.com/api-evangelist/bonitasoft/refs/heads/main/apis.yml
