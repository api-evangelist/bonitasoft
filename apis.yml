  description: >-
    Configure how Bonita automatically deletes obsolete business data. A retention rule applies to a specific
    business object type and defines when its instances become eligible for deletion based on a reference
    date (creation or last update) and a retention period in days. The data retention service runs on
    a configurable cron schedule.


