- aid: bonitasoft:bonitasoft-bdm-api
  name: Bonitasoft BDM API
  description: >-
    Show status or install or update the Business Data Model.


    Installing or updating a BDM needs to be done in two successive steps:


    1. Upload a BDM file

    2. Install/Update the previously uploaded file


    **To do this, the maintenance mode needs to be enabled.**


    **In Enterprise editions, if you have an access control file installed, you need to delete it before
    installing or updating your BDM.**
  humanURL: https://documentation.ofelia.com/bonita/latest/api/rest-api-overview
