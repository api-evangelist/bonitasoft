- aid: bonitasoft:bonitasoft-applicationmenu-api
  name: Bonitasoft Application Menu API
  description: >-
    Manage the set of menus in an application. This set of menus enables a user to navigate to the application
    pages.


    There are two types of menu item:


    A top-level item appears in the navigation bar of the application. A top-level item can be clickable,
    leading to a page, or can be a parent for a menu of clickable items.

    A child menu item becomes visible in a menu when the parent is selected. A child menu item is clickable
    and leads to a page.

    Each menu item has an index that defines the position in the menu. For a top-level menu item, this
    is the position in the the navigation bar counting from the left. For a child menu item, this is the
    position in the menu counting from the top.
  humanURL: https://documentation.ofelia.com/bonita/latest/api/rest-api-overview
  baseURL: https://{subscription}.bonitacloud.com/bonita
  tags:
  - ApplicationMenu
