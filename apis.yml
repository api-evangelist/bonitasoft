apis:
- aid: bonitasoft-bonita-web-rest-api
  name: Bonita Web REST API
  description: >-
    The Bonita Web REST API exposes every Bonita Runtime feature reachable over
    HTTP — BPM (processes, cases, tasks, activities, flow nodes, timers,
    messages, signals), identity (users, groups, roles, memberships, profiles,
    custom user information), applications and pages, the Business Data Model
    and business data queries, documents and comments, and platform/license
    administration. It is described by a single first-party OpenAPI 3.0.2
    document (153 paths, 224 operations, 162 schemas) that Bonitasoft treats as
    the single source of truth for the HTTP surface and publishes as an
    open-source repository, a versioned GitHub release asset, and a live ReDoc
    reference at api-documentation.ofelia.com.
  humanURL: https://documentation.ofelia.com/bonita/latest/api/rest-api-overview
  baseURL: https://{subscription}.bonitacloud.com/bonita
  x-base-url-note: >-
    TEMPLATED ON PURPOSE — do not "repair" this to a concrete host. Bonita is
    self-hosted software, so there is no vendor-operated API host to name. The
    documented forms are: Bonita Cloud production
    https://{customer-name}.bonitacloud.com/bonita and non-production
    https://{customer-name}-integration.bonitacloud.com/bonita
    (https://documentation.ofelia.com/cloud/latest/manage/url-customization);
    on premises {scheme}://{host}:{port}/bonita
    (https://documentation.ofelia.com/bonita/latest/api/rest-api-overview quotes
    "http://host:port/bonita/API/..."); and local
    http://localhost:8080/bonita. The OpenAPI servers[] block declares
    http://localhost:8080/bonita labelled "Sample url for a local development
    server", which is a true statement about a self-hosted product rather than a
    placeholder defect, so it is left untouched. repair-api-bases.py returns
    verdict `no-usable-base` for this provider by design.
  tags:
  - BPM
  - Workflow
  - Process Automation
  - Identity
  - Business Data
