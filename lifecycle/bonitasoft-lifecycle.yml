rebrand:
  event: Bonitasoft became Ofelia
  date: '2026-06-09'
  domains_moved:
    - {from: 'www.bonitasoft.com', to: 'www.ofelia.com', mechanism: 301}
    - {from: 'documentation.bonitasoft.com', to: 'documentation.ofelia.com', mechanism: 301}
    - {from: 'api-documentation.bonitasoft.com', to: 'api-documentation.ofelia.com', mechanism: 301}
    - {from: 'community.bonitasoft.com', to: 'community.ofelia.com', mechanism: 301}
  retained: >-
    The GitHub organization is still github.com/bonitasoft and the product is
    still Bonita. Only the corporate identity and web properties moved. The
    security contact moved too: product-security@ofelia.com.
  lifecycle_significance: >-
    A rebrand is a lifecycle event for API consumers: every hardcoded
    bonitasoft.com docs URL, every bookmarked reference, and the OpenAPI repo's
    own homepage field (still https://api-documentation.bonitasoft.com/) now
    depend on a redirect. The redirects are in place and working as of
    2026-08-17.
