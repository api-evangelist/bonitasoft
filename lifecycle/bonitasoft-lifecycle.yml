deprecation_clusters:
  applications: >-
    The entire legacy Application/ApplicationMenu/ApplicationPage write surface is
    deprecated, consistent with the move to Bonita Fabric / UI Builder and
    "advanced applications".
  profiles_and_themes: >-
    Profile, ProfileEntry and Theme writes are deprecated — the Bonita Portal
    look-and-feel and profile-entry model these served are legacy.
  design_time_writes: >-
    createProcess / updateProcessById / uploadProcess and the BDM install/import
    operations are deprecated in favour of the Maven/Studio build-and-deploy path
    (see cli/bonitasoft-cli.yml). Design-time mutation over REST is being closed.

sla:
  published: true
  scope: Bonita Cloud only (managed offering)
  uptime_target: null
  uptime_language: >-
    "Bonitasoft will use commercially reasonable efforts to ensure an overall
    availability in each billing month for its production AppRuntime." No numeric
    percentage is stated on the availability page; the pricing page separately
    advertises a "99.9% uptime SLA" as a Bonita Enterprise inclusion.
  availability_formula: '(Uptime / Total Available Time) x 100%, excluding maintenance windows and force majeure'
  maintenance_notice:
    scheduled: at least three business days before any downtime
    unscheduled: aims for one business day notice
  redundancy: >-
    Application redundancy with load balancing, continuous data backup, and
    network redundancy across separate zones within the same region.
  pages:
    service_availability: https://documentation.ofelia.com/cloud/latest/sla/service-availability
    maintenance_and_upgrades: https://documentation.ofelia.com/cloud/latest/sla/maintenance-and-upgrades
    disaster_recovery: https://documentation.ofelia.com/cloud/latest/sla/disaster-recovery
    high_performance: https://documentation.ofelia.com/cloud/latest/sla/high-performance
    data_management: https://documentation.ofelia.com/cloud/latest/sla/data-management
  support_response_times: not published
  self_hosted_note: >-
    None of this applies to a self-hosted Bonita. On premises the customer owns
    availability entirely; the SLA is a property of the Bonita Cloud contract.

