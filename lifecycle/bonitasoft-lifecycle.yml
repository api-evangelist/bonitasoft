deprecation:
  policy_documented: false
  policy_url: null
  sunset_header: false
  deprecation_header: false
  checked: '2026-08-17'
  evidence:
    - url: https://documentation.ofelia.com/bonita/latest/version-update/product-versioning
      status: 200
      finding: >-
        Documents the versioning scheme and release cadence but states no
        maintenance window, no end-of-life date and no deprecation or sunset
        policy.
    - url: https://documentation.ofelia.com/bonita/latest/support
      status: 404
    - url: https://documentation.ofelia.com/bonita/latest/maintenance-policy
      status: 404
    - url: https://documentation.ofelia.com/bonita/latest/product-lifecycle
      status: 404
  in_spec_deprecation:
    supported: true
    mechanism: 'OpenAPI `deprecated: true` on the operation'
    deprecated_operation_count: 33
    note: >-
      This is the interesting finding. Bonitasoft has NO published deprecation
      POLICY, but it does mark deprecation in the contract — 33 of 224 operations
      (15%) carry `deprecated: true`. So a machine can see WHAT is deprecated
      while a human cannot find out WHEN it will be removed or what replaces it.
      No Deprecation pointer is emitted in apis.yml because the check reads a
      published policy, and there is none.

