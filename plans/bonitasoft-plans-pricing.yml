billing_note: >-
  Only one of four tiers carries a published price. Bonita Free is $0. The other
  three — Bonita Enterprise, Ofelia Assistant and Ofelia Workflow — are
  "custom pricing" / "request a demo" with no number, no unit and no billing
  period stated. Historically Bonita subscriptions were priced per process user
  on 1-year and 3-year terms, but that is not published on the current page and
  is not recorded here as fact.

plans:
- name: Bonita Free
  aka: Bonita Community Edition
  product: Bonita BPM
  price: 0
  currency: USD
  billing_period: unlimited
  published: true
  signup: https://www.ofelia.com/downloads
  signup_friction: No credit card required
  quota:
    process_instances: 150 per month
  limits:
    case_creation: >-
      Enforced in the API, not just in the contract. Community Edition 2024.3 and
      later returns HTTP 429 with a Retry-After date-time on POST /API/bpm/case
      and POST /API/bpm/process/{id}/instantiation once the monthly case counter
      is exhausted. See rate-limits/bonitasoft-rate-limits.yml.
  included:
  - Process application development
  - UI customization
  - Collaboration and integration capabilities
  - Full Bonita Web REST API (the OpenAPI contract is identical across editions)
  excluded:
  - Task Delegation (subscription editions only)
  - BDM data retention / GDPR rules (subscription editions only)
  - BDM access control
  - Bonita Fabric, Work Hub, native AI connectors, IDP
  - SLA, RBAC/SSO, high availability
  - Bonita Update Tool binaries from the Customer Service Center
  license: Open source (engine LGPL-2.1; OpenAPI GPL-2.0)

