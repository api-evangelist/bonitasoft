free_tier:
  exists: true
  kind: free-forever open-source edition with a metered ceiling
  note: >-
    Unusual and worth flagging: the free tier is not a trial. It is the full
    open-source product with a hard monthly case-creation quota enforced at the
    API layer. That makes Bonita Free a genuinely evaluable API surface — an agent
    or developer can stand up the Docker Official Image and call all 224
    operations without a sales conversation. See sandbox/bonitasoft-sandbox.yml.

trial:
  exists: false
  note: No time-limited trial of the Enterprise edition is published; the route is a demo request.

self_hosted_pricing_note: >-
  Bonita is licensed software, so "plan" and "quota" mean something different
  here than for a hosted API. Compute, storage and availability are the
  customer's cost on premises; Bonita Cloud folds them into the subscription.
  There is no per-request, per-token or per-seat API price because there is no
  vendor-operated API gateway to meter.

