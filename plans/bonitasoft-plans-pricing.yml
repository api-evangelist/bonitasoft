  currency: null
  billing_period: null
  published: false
  signup: https://www.ofelia.com/demo
  included:
  - Bonita Fabric
  - Bonita Work Hub
  - Native AI connectors
  - IDP (intelligent document processing) capabilities
  - SLA enforcement
  - RBAC / SSO
  - High availability
  - 99.9% uptime SLA
  - Professional services
  note: >-
    The pricing page advertises "99.9% uptime SLA" as an Enterprise inclusion,
    while the Bonita Cloud availability SLA page states only "commercially
    reasonable efforts" with no numeric target. Those two published statements do
    not agree; both are recorded verbatim rather than reconciled. See
    lifecycle/bonitasoft-lifecycle.yml.
  edition_family_note: >-
    The release notes reveal finer-grained subscription tiers than the pricing
    page does — features are gated to "Teamwork, Efficiency, Performance,
    Enterprise and Scale editions". Those five named editions are not on the
    pricing page and have no published prices.

