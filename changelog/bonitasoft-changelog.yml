api_contract_note: >-
  Every release ships three assets: the bundled OpenAPI YAML, a zip, and a
  Postman collection generated from it. The contract release dates track the
  product releases closely (1.0.7 on 2026-04-28 = 2026.1-u0 day; 1.0.9 on
  2026-06-19 = the 2026.2-b5 build), which is evidence the spec is generated as
  part of the release process rather than maintained by hand after the fact.

corporate:
- event: Bonitasoft rebranded to Ofelia
  date: '2026-06-09'
  note: >-
    Not in the product release notes, but a change every API consumer feels: the
    documentation, API reference and community hosts all moved from
    bonitasoft.com to ofelia.com behind 301s. Announced alongside a governed
    agentic AI orchestration line (private preview stated for Q3 2026, general
    availability early 2027).
