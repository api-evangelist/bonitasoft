  purpose: Packaged a Bonita application for deployment; superseded by the Maven plugin.

studio_note: >-
  Bonita Studio (github.com/bonitasoft/bonita-studio) is the primary developer
  tool and it is a desktop IDE, not a CLI. Much of what other vendors expose as
  CLI commands — scaffolding a project, generating a REST API extension, deploying
  to a local test runtime — happens in Studio here, with the Maven plugin as the
  headless equivalent for CI.

archetypes:
  note: >-
    Maven archetypes are the scaffolding equivalent of `<vendor> init`:
  items:
  - {name: bonita-rest-api-extension-archetype, repository: 'https://github.com/bonitasoft/bonita-rest-api-extension-archetype', purpose: Creates a new Bonita REST API extension project.}
  - {name: bonita-connector-archetype, repository: 'https://github.com/bonitasoft/bonita-connector-archetype', purpose: Creates a new Bonita connector project.}
  - {name: bonita-actorfilter-archetype, repository: 'https://github.com/bonitasoft/bonita-actorfilter-archetype', purpose: Creates a new Bonita actor filter project.}
  - {name: bonita-theme-archetype, repository: 'https://github.com/bonitasoft/bonita-theme-archetype', purpose: Creates a Bonita theme project.}
