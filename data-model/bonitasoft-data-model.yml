business_data_note: >-
  The Business Data Model is the one part of this graph the OpenAPI CANNOT
  describe. Business objects are defined per deployment at design time, so
  /API/bdm/businessData/{businessDataType} is generic and its queries are
  addressed by name (?q=<namedQuery>). An agent cannot enumerate a customer's
  business entities from the published contract — it must read that deployment's
  BDM. This is the single biggest discoverability limit of the Bonita API.

expansion_note: >-
  Related entities are inlined with the repeatable d= (deploy) query parameter,
  e.g. /API/bpm/flowNode/143?d=processId&d=caseId&d=assigned_id. See
  conventions/bonitasoft-conventions.yml — d= is documented in prose but not
  declared per-operation in the spec.

