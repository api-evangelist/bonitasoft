  entities: [ProcessDefinition, ProcessDeploymentInfo, DesignProcessDefinition, FlowElementContainerDefinition, Contract, ContractInput, ContractConstraint, Expression, ActorDefinition, Actor, ActorMember, ProcessParameter, ProcessConnectorDependency, FormMapping, ProcessSupervisor, ProcessResolutionProblem, Diagram, ProcessInfo]
- name: BPM runtime
  description: What is executing right now.
  entities: [ProcessInstance, Activity, FlowNode, AbstractTask, HumanTask, UserTask, ManualTask, Task, ProcessInstanceVariable, ActivityVariable, ProcessInstanceComment, ProcessInstanceDocument, ConnectorInstance, ConnectorFailure, BPMFailure, TimerEventTrigger, Message, Signal, DelegationRule, DelegatedTask, DelegationUser]
- name: BPM archive
  description: The immutable record of what completed. Every entity here mirrors a runtime entity.
  entities: [ArchivedProcessInstance, ArchivedActivity, ArchivedFlowNode, ArchivedHumanTask, ArchivedManualTask, ArchivedUserTask, ArchivedTask, ArchivedProcessInstanceVariable, ArchivedActivityVariable, ArchivedProcessInstanceComment, ArchivedProcessInstanceDocument, ArchivedConnectorInstance, ArchivedBPMFailure]
