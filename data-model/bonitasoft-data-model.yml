source: >-
  Derived from openapi/bonitasoft-bonita-openapi.yml (Bonita API 1.0.9, 162
  component schemas, 153 paths), by walking every schema `$ref` link and every
  id-reference property (144 fields matching *_id / *Id excluding the primary
  `id`). Domain naming cross-checked against
  https://documentation.ofelia.com/bonita/latest/api/api-glossary.
summary:
  entities: 162
  ref_links: 39
  id_reference_fields: 144
  domains: 6
  note: >-
    Bonita's model has an unusual shape for an API data model: it is a
    BPMN execution graph, not a CRUD object graph. The dominant relationship is
    not "belongs_to a parent record" but "was produced by a definition and lives
    inside a case", and almost every runtime entity has an ARCHIVED twin, because
    a completed BPMN element moves out of the live tables. An agent that models
    Bonita as ordinary REST resources will 404 constantly (see
    errors/bonitasoft-problem-types.yml, the 404 remediation).

id_conventions:
  primary_key: >-
    `id` — a numeric string on most resources. Not prefixed and not globally
    unique across resource types, so an id alone does not identify what it is.
  foreign_key_styles:
  - 'camelCase: processId, caseId, rootCaseId, parentCaseId, assigneeId, actorId'
  - 'snake_case: user_id, group_id, role_id, process_id, actor_id, case_id, profile_id'
  inconsistency: >-
    Both styles coexist, sometimes on sibling fields of the SAME schema — Activity
    carries processId, parentCaseId, rootCaseId, rootContainerId, actorId AND
    assigned_id. ActorMember uses actor_id/role_id/group_id/user_id while
    DelegatedTask uses actorId/assigneeId. This is a real ergonomics defect: a
    generated client cannot infer the foreign-key name from the entity name.
  archive_convention: >-
    Archived entities carry `sourceObjectId` (or `sourcedObjectId` on the variable
    schemas — another spelling inconsistency) pointing back at the id the live
    entity had before archiving. That field is the join between the live and
    archived halves of the model.

